[phases.setup]
aptPkgs = ["chromium", "chromium-driver", "libglib2.0-0", "libnss3", "libatk-bridge2.0-0", "libdrm2", "libxkbcommon0", "libxcomposite1", "libxdamage1", "libxrandr2", "libgbm1", "libasound2", "fonts-liberation"]
nixPkgs = ["python311", "python311Packages.pip", "ffmpeg", "git"]

[phases.build]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "python main.py"
